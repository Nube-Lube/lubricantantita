name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: |
          brew install mint
          mint install yonaskolb/XcodeGen@2.36.1

      - name: Generate Xcode project
        run: mint run yonaskolb/XcodeGen@2.36.1 xcodegen generate --spec project.yml

      - name: Build for device
        run: |
          xcodebuild \
            -project lubricantante.xcodeproj \
            -scheme lubricantante \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ${{ github.workspace }}/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES

      - name: Find and copy Swift frameworks
        run: |
          # Find the built app
          APP_PATH=$(find ${{ github.workspace }}/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "App path: $APP_PATH"
          
          # Xcode should have created SwiftSupport folder somewhere
          echo "Searching for Swift libraries in build output..."
          find ${{ github.workspace }}/build -name "*.dylib" 2>/dev/null | head -20
          
          # Check if Xcode already embedded them
          if [ -d "$APP_PATH/Frameworks" ] && [ "$(ls -A $APP_PATH/Frameworks)" ]; then
            echo "✓ Xcode already embedded Swift frameworks!"
            ls -lh "$APP_PATH/Frameworks/"
          else
            echo "⚠️  No frameworks embedded by Xcode, copying manually..."
            
            # Create Frameworks directory
            mkdir -p "$APP_PATH/Frameworks"
            
            # Search for Swift 5.0 dylibs in Xcode
            XCODE_ROOT="/Applications/Xcode_15.4.app/Contents/Developer"
            
            # Try multiple possible locations
            POSSIBLE_PATHS=(
              "$XCODE_ROOT/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/iphoneos"
              "$XCODE_ROOT/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/usr/lib/swift"
              "$XCODE_ROOT/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
            )
            
            for path in "${POSSIBLE_PATHS[@]}"; do
              echo "Checking: $path"
              if [ -d "$path" ]; then
                echo "✓ Found! Contents:"
                ls "$path" | head -10
                
                # Look for dylibs
                if ls "$path"/*.dylib >/dev/null 2>&1; then
                  cp "$path"/*.dylib "$APP_PATH/Frameworks/" 2>/dev/null || true
                  echo "Copied dylibs from $path"
                  break
                fi
              fi
            done
            
            # If still no dylibs, do a full search
            DYLIB_COUNT=$(ls "$APP_PATH/Frameworks"/*.dylib 2>/dev/null | wc -l)
            if [ "$DYLIB_COUNT" -eq 0 ]; then
              echo "Still no dylibs, doing full Xcode search..."
              SWIFT_CORE=$(find "$XCODE_ROOT" -name "libswiftCore.dylib" -path "*/iphoneos*" 2>/dev/null | head -1)
              if [ -n "$SWIFT_CORE" ]; then
                SWIFT_DIR=$(dirname "$SWIFT_CORE")
                echo "Found Swift libraries at: $SWIFT_DIR"
                cp "$SWIFT_DIR"/*.dylib "$APP_PATH/Frameworks/"
                echo "Copied all dylibs from $SWIFT_DIR"
              fi
            fi
          fi
          
          # Final check
          echo ""
          echo "=== Final Frameworks directory ==="
          ls -lh "$APP_PATH/Frameworks/" 2>/dev/null || echo "ERROR: No Frameworks directory!"
          
          FINAL_COUNT=$(find "$APP_PATH/Frameworks/" -name "*.dylib" 2>/dev/null | wc -l)
          echo "Total dylibs: $FINAL_COUNT"
          
          if [ "$FINAL_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No Swift libraries found!"
            echo "App will crash on launch!"
          else
            echo "✓ Swift libraries embedded successfully"
          fi

      - name: Create IPA
        run: |
          APP_PATH=$(find ${{ github.workspace }}/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          
          # Show app size before packaging
          echo "App bundle size:"
          du -sh "$APP_PATH"
          
          # Create Payload folder
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/lubricantante.app
          
          # Create IPA
          zip -r lubricantante.ipa Payload
          
          echo ""
          echo "=== FINAL IPA ==="
          ls -lh lubricantante.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lubricantante-${{ github.sha }}
          path: lubricantante.ipa
          retention-days: 30
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        # Pin to 2.36.1 — newer XcodeGen versions write objectVersion=77
        # which Xcode 15.4 rejects as a "future Xcode project file format".
        run: |
          brew install mint
          mint install yonaskolb/XcodeGen@2.36.1

      - name: Generate Xcode project
        run: mint run yonaskolb/XcodeGen@2.36.1 xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project lubricantante.xcodeproj \
            -scheme lubricantante \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ${{ github.workspace }}/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Find .app
        run: find ${{ github.workspace }}/build -name "*.app" -type d

      - name: Package IPA
        run: |
          APP_PATH=$(find ${{ github.workspace }}/build -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/lubricantante.app
          zip -r lubricantante.ipa Payload
          ls -lh lubricantante.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lubricantante-${{ github.sha }}
          path: lubricantante.ipa
          retention-days: 30
